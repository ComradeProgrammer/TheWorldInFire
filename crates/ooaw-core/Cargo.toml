[package]
name = "ooaw-core"
version = "0.1.0"
edition = "2021"
description = "OOAW game kernel: authoritative state, dice, turn sequencer, and WebAssembly rules-plugin host"
build = "build.rs"

[dependencies]
ooaw-plugin-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "parallel-compilation",
] }
